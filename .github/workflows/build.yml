name: build

# **単一 exe を作って Release に載せる。**
# 署名は無いので、**誰でも同じ手順で同じものを作れることが唯一の裏付けになる。**
# ここでやっていることは README の「自分でビルドする」と同じである。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # **Windows でしか動かない。** 画面のキャプチャに Windows.Graphics.Capture を使う
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: 復元
        run: dotnet restore

      - name: テスト
        run: dotnet test tests/Observer.Tests --configuration Release

      - name: 単一 exe を作る
        run: >
          dotnet publish src/Observer
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish

      - name: 単一の exe になっているかを確かめる
        shell: pwsh
        run: |
          $exe = Get-Item publish/rematch-observer.exe
          "{0:N1} MB" -f ($exe.Length / 1MB)
          # **前提の要らない単一 exe であることが配布の前提である**（ADR-0067）。
          # pdb 以外に何か残っていたら、それは持ち歩く必要があるということ
          $extra = Get-ChildItem publish -Recurse |
            Where-Object { $_.Name -ne "rematch-observer.exe" -and $_.Extension -ne ".pdb" }
          if ($extra) { $extra | Format-Table Name, Length; throw "exe 以外が出力されています" }

      - name: 動くかを確かめる
        shell: pwsh
        run: |
          # 走る環境に .NET があっても無くても同じ結果になるはずのもの
          & publish/rematch-observer.exe help
          if ($LASTEXITCODE -ne 0) { throw "help が失敗しました" }

      - uses: actions/upload-artifact@v4
        with:
          name: rematch-observer
          path: publish/rematch-observer.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rematch-observer
          path: publish

      - name: Release に載せる
        uses: softprops/action-gh-release@v2
        with:
          files: publish/rematch-observer.exe
          body: |
            `rematch-observer.exe` は**前提の要らない単一 exe**です（.NET の導入は要りません）。

            ⚠ **コード署名がありません。** 初回の起動時に SmartScreen の警告が出ます。
            **署名の代わりにソースを公開しています。** 中身は `src/` で確かめられます。
